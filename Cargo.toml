[workspace]
members = [
  "crates/cino-codec",
  "crates/cino-syntax",
  "crates/cino-sema",
  "crates/cino-ir",
  "crates/cino-vm",
  "crates/cino-runtime",
  "crates/cino-ffi-c",
  "crates/cino-cli",
  "examples/counter_app",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
